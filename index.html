    <script type="text/javascript">

      let l = window.location;
      if (l.search) {

        if( l.search.indexOf("?rd=") > -1 ) {
          let newPath = "/battletech-tools" + l.search.replace("?rd=%2Fbattletech-tools", "");
          newPath = newPath.replace("?rd=/battletech-tools", "");

          // public/404.html packs the query after &q= and turns each & into ~and~.
          const queryAt = newPath.indexOf("&q=");
          const query = queryAt > -1 ? "?" + newPath.slice(queryAt + 3) : "";
          if( queryAt > -1 ) {
            newPath = newPath.slice(0, queryAt);
          }

          while( newPath.indexOf("%2F") > -1 ) {
            newPath = newPath.replace("%2F", "/");
          }

          window.history.replaceState(
            null,
            null,
            (newPath + query).replace(/~and~/g, "&") + l.hash
          );
        }
      }


    </script>

  <!-- beta-issues-button -->
<style>
li.beta-issues{margin-left:auto!important;align-self:center;list-style:none}
li.beta-issues + li.logo{margin-left:0!important}
li.beta-issues a.beta-issues-button{display:block;background:#c0392b!important;color:#fff!important;font-weight:700;font-size:.8rem;
padding:.4rem .75rem;border-radius:.5rem!important;margin:0 .5rem!important;min-height:0!important;white-space:nowrap;text-decoration:none}
li.beta-issues a.beta-issues-button:hover{background:#e74c3c!important}
li.beta-ideas{align-self:center;list-style:none}
li.beta-ideas + li.logo{margin-left:0!important}
li.beta-ideas a.beta-ideas-button{display:block;background:#2471a3!important;color:#fff!important;font-weight:700;font-size:.8rem;
padding:.4rem .75rem;border-radius:.5rem!important;margin:0 .5rem 0 0!important;min-height:0!important;white-space:nowrap;text-decoration:none}
li.beta-ideas a.beta-ideas-button:hover{background:#2e86c1!important}
@media(max-width:1599.98px){
header.topmenu ul.main-menu::after{content:"";order:1;flex-basis:100%;height:0}
header.topmenu ul.main-menu>li.beta-issues{order:2;margin-left:0!important}
header.topmenu ul.main-menu>li.beta-ideas{order:2}
header.topmenu ul.main-menu>li.logo{order:3;margin-left:auto!important}
}
@media(max-width:767.98px){
.mobile-menu{padding-top:7.5rem!important}
header.topmenu ul.main-menu>li.logo{order:0}
header.topmenu ul.main-menu>li.beta-issues,header.topmenu ul.main-menu>li.beta-ideas{flex:1 1 40%;min-width:0;padding-bottom:.25rem}
header.topmenu ul.main-menu>li a.beta-issues-button,header.topmenu ul.main-menu>li a.beta-ideas-button{white-space:normal;text-align:center}
}
</style>
<script>
(function(){
  function button(cls,href,title,text){
    var li=document.createElement("li");li.className=cls;
    var a=document.createElement("a");a.className=cls+"-button";a.href=href;
    a.target="_blank";a.rel="noopener noreferrer";a.title=title;
    a.textContent=text;li.appendChild(a);return li;
  }
  function add(){
    var logo=document.querySelector("header.topmenu ul.main-menu > li.logo");
    if(!logo||logo.parentNode.querySelector("li.beta-issues"))return;
    var ideas=button("beta-ideas","https://github.com/ngcfells/battletech-tools/issues/new?labels=enhancement","We are the beta test: see the ideas and suggest one on GitHub","Beta: Ideas/Suggestions");
    var issues=button("beta-issues","https://github.com/ngcfells/battletech-tools/issues/new?labels=bug","We are the beta test: report a problem on GitHub","Beta: Report an Issue");
    logo.parentNode.insertBefore(ideas,logo);logo.parentNode.insertBefore(issues,ideas);
  }
  new MutationObserver(add).observe(document.documentElement,{childList:true,subtree:true});
  add();
})();
</script>
<style>
a.kofi-tip{display:inline-block;margin-left:.5rem;padding:.05rem .4rem;background:#72a4f2;color:#fff!important;font-size:.7rem;font-weight:700;
line-height:1.4;border-radius:.25rem;text-decoration:none;vertical-align:middle}
</style>
<script>
// A small Ko-fi tip link beside the NGCFells name in About > Current Maintainers.
(function(){
  function isAbout(){return /^\/battletech-tools\/about\/?$/.test(location.pathname);}
  function place(){
    if(!isAbout()||document.querySelector(".kofi-tip"))return;
    var name=Array.prototype.find.call(document.querySelectorAll("main.content h3"),function(heading){return heading.textContent.trim()==="NGCFells";});
    if(!name)return;
    var tip=document.createElement("a");tip.className="kofi-tip";tip.href="https://ko-fi.com/M5K429C47U";
    tip.target="_blank";tip.rel="noopener noreferrer";tip.title="If you would like to help cover costs of development please click here.";
    tip.textContent="Tip";name.appendChild(tip);
  }
  new MutationObserver(place).observe(document.documentElement,{childList:true,subtree:true});
  window.addEventListener("popstate",place);
  window.addEventListener("load",place);
  place();
})();
</script>
