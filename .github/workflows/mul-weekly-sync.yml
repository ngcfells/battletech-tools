name: Weekly MUL Sync

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MUL
        uses: actions/checkout@v4
        with:
          ref: MUL

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Sync from masterunitlist.battletech.com
        run: npm run mul:sync

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/mul-sync/live-units.json tools/mul-sync/legacy-duplicate-candidates.json src/data/mul/live
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly MUL sync from masterunitlist.battletech.com"
            git push origin HEAD:MUL
          fi

  alert-on-failure:
    needs: sync
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create or update sync failure alert
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Weekly MUL sync failed";
            const body = [
              `@${context.repo.owner} the scheduled sync from masterunitlist.battletech.com failed.`,
              "",
              `Inspect the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) — this is often a Cloudflare challenge blocking the bot, or a change in the site's page structure/data schema.`,
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                assignees: [context.repo.owner],
              });
            }
